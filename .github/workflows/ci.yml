name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & static-analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Ruff check (lint & imports)
        run: uv run ruff check .

      - name: Ruff format (code style)
        run: uv run ruff format --check .

      - name: Ty (typing)
        run: uv run ty check

  test:
    name: Unit-test matrix
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Verify fixture integrity
        run: uv run python scripts/check_jabcode_fixtures.py

      - name: Run tests with coverage
        run: uv run pytest -v --cov=pyhue2d --cov-branch --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: firestrand/pyhue2d
          flags: ${{ matrix.python-version }}
          fail_ci_if_error: true

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build distributions with uv
        run: uv build