[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhue2d"
version = "0.3.0"
description = "Toolkit for colourful 2-D barcodes such as JAB Code"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "Travis Silvers"}]
dependencies = [
    "numpy>=1.24.0",
    "Pillow>=9.0.0",
    "typing-extensions>=4.0.0",
    "scipy>=1.9.0",
    "scikit-image>=0.20.0",
    "opencv-python>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.8.0",
    "ruff>=0.14.0",
    "ty>=0.0.14",
    "types-pillow>=10.2.0",
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "pre-commit>=2.20.0",
    "mutmut>=2.4.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.8.0",
    "ruff>=0.14.0",
    "ty>=0.0.14",
    "types-pillow>=10.2.0",
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "pre-commit>=2.20.0",
    "mutmut>=2.4.0",
]

[project.urls]
Homepage = "https://github.com/firestrand/pyhue2d"
Documentation = "https://github.com/firestrand/pyhue2d"
Repository = "https://github.com/firestrand/pyhue2d"

[project.scripts]
pyhue2d = "pyhue2d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "T201"]
ignore = [
    "E203",
    "E501",
    "E712",
    "E722",
    "E741",
    "F401",
    "F402",
    "F541",
    "F811",
    "F841",
]

[tool.ruff.lint.per-file-ignores]
"src/pyhue2d/cli.py" = ["T201"]
"tests/**" = ["T201"]
"scripts/**" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["pyhue2d"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
no-matching-overload = "ignore"
not-iterable = "ignore"
not-subscriptable = "ignore"
unresolved-attribute = "ignore"
unsupported-operator = "ignore"

[tool.ty.src]
exclude = ["tests/**"]

[tool.mutmut]
source_paths = ["src/pyhue2d/jabcode/decoder.py"]
also_copy = ["src", "pytest.ini"]
pytest_add_cli_args = ["tests/facts/test_decode_example1.py", "tests/facts/test_decode_logs.py"]
mutate_only_covered_lines = false
use_git_change_detection = false
track_dependencies = false






